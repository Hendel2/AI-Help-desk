<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Help Desk: plataforma de Help Desk de TI multiempresa com assistência de inteligência artificial."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a101d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI Help Desk</title>
    <script>
      // Aplica o tema antes do React para não piscar o tema errado.
      // Mesma regra de src/features/theme/themeStorage.ts (chave e valores).
      ;(function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('ai-helpdesk.theme')
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          theme = stored === 'dark' || (stored !== 'light' && prefersDark) ? 'dark' : 'light'
        } catch (error) {
          // Sem storage: segue o padrão claro.
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
