<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ticket { fill: #1f5ad9; }
    .mark { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ticket { fill: #6fa1ff; }
      .mark { stroke: #06132b; }
    }
  </style>
  <mask id="notches">
    <rect width="32" height="32" fill="#fff" />
    <circle cx="3" cy="16" r="3.25" fill="#000" />
    <circle cx="29" cy="16" r="3.25" fill="#000" />
  </mask>
  <rect class="ticket" x="3" y="6" width="26" height="20" rx="4" mask="url(#notches)" />
  <path class="mark" d="M10.5 16.25 14 19.75 21.5 12.25" fill="none" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
</svg>
