[project]
name = "ai-help-desk-backend"
version = "0.1.0"
description = "API do AI Help Desk (FastAPI + SQLAlchemy + MySQL)."
requires-python = ">=3.12"
# As dependências ficam em requirements.txt / requirements-dev.txt (instalação via pip -r).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # Starlette 1.x recomenda o pacote httpx2 para o TestClient; httpx segue suportado.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# O diretório local backend/alembic/ (migrations) não é o pacote alembic.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa Depends()/Query() como valores padrão de parâmetros.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
